    steps:
      - name: "clone the code"
        run: echo "cloning the code currently"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: "build the code"
        run: echo "running the build commands for building the code"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: "run the testcases"
